version: 2

models:
  - name: stg_category_daily_summary
    description: "Typed pass-through of the Gold category/day/region rollup, ready for marts"
    columns:
      - name: category_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('youtube_categories')
                field: category_id

      - name: trending_date
        tests:
          - not_null

      - name: region
        description: "2-letter country code the row was aggregated for (e.g. US, GB, CA); resolved from the Bronze source filename"
        tests:
          - not_null

      - name: video_count
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true

      - name: total_views
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: total_likes
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: total_dislikes
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: avg_engagement_ratio
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

    tests:
      # Composite uniqueness — the two Glue jobs' dedupe logic is already
      # unit tested in Python (see tests/test_transform_logic.py); this test
      # is the warehouse-side check that nothing slipped past it before
      # a dashboard ever reads it. Region is part of the grain now: the
      # same category can trend on the same day in multiple countries.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - category_id
              - trending_date
              - region
